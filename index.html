<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the webpage display properly across different
         screen sizes, including mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Provides a description of the webpage for search engines
         and other services that display page information. -->
    <meta name="description" content="A Hello World webpage created using HTML5, Git, GitHub, and Netlify.">
    <!-- Identifies the creator of the webpage. -->
    <meta name="author" content="Lauren Pratt">
    <title>Hello World!</title>
</head>
<body>
    <header>
        <h1>Hello World!</h1>
        <p>Welcome to my first deployed webpage</p>
    </header>
    <main>
        <section>
            <h2>My First Webpage</h2>
            <p>
                Hello, World! This page was created to practice
                HTML5, Git, GitHub, and web deployment with Netlify.
            </p>
            <figure>
                <img
                    src="hello-world.png"
                    alt="Hello world image"
                    width="300"
                >
                <figcaption>
                    My introduction to web development begins with Hello, World!
                </figcaption>
            </figure>
        </section>
    </main>
    
    <footer>Created by Lauren Pratt · 2026</footer>
</body>
</html>
